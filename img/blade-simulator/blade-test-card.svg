<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A wind turbine blade in a fatigue test: the root is bolted to a large test stand, and a clamp on the blade is connected to a blade exciter on the floor">
<title>Blade fatigue test</title>
<style>
  .sky { fill: url(#sky); } .floor { fill: #ddd5c7; } .plate { fill: #ece7de; } .rail { stroke: #a99d89; }
